name: Update Mayhem data

on:
  schedule:
    - cron: "17 10 1,15 * *"   # 1st and 15th of each month, 10:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Only these champions (comma-separated, e.g. jinx,ahri). Blank = all."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python scripts/update.py --only "$ONLY"
          else
            python scripts/update.py
          fi
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data update $(date -u +%Y-%m-%d) (patch $(python -c 'import json;print(json.load(open("data/meta.json")).get("patch"))'))"
            git push
          fi
